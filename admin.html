<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>D.LIGHT 팀 대항전 집계결과</title>
<meta name="description" content="팀 대항전 수요조사 운영진용 실시간 집계입니다.">
<meta property="og:title" content="D.LIGHT 팀 대항전 집계결과">
<meta property="og:description" content="팀 대항전 수요조사 운영진용 실시간 집계입니다.">
<meta property="og:image" content="https://dlight-night.github.io/img/og_admin.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://dlight-night.github.io/admin.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --black:#000; --magenta:#ff12c8; --pink:#ffc2f1; --plum:#5a0048; --soft:#e9c3e2;
  --mute:#a99aa8; --line:rgba(255,255,255,.16); --panel:#16041a;
  --display:"Unbounded","Pretendard Variable",sans-serif;
  --body:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--black);color:#fff;font-family:var(--body);-webkit-text-size-adjust:100%}
body{min-height:100vh;line-height:1.5;word-break:keep-all;font-variant-numeric:tabular-nums lining-nums}
button{font:inherit;color:inherit}
.wrap{width:min(1120px,100% - 32px);margin:0 auto;padding:32px 0 64px}

/* 머리 */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid var(--line)}
.top p{font:500 13px/20px var(--display);letter-spacing:.02em;color:var(--soft)}
.top h1{margin-top:6px;font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.15;letter-spacing:-.03em}
.sync{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--mute)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--magenta);flex:none}
.sync.bad i{background:#ffb4c8}
.sync.bad #when{color:#ffb4c8}
#stamp b{display:block;font-weight:500;color:#fff}
#stamp small{display:block;font-size:14px;line-height:20px}
.sync button{min-height:44px;flex-shrink:0;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:none;font-size:14px;font-weight:600;cursor:pointer}
.sync button:hover{border-color:#fff}
.golink{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--magenta);color:#fff;font-size:14px;font-weight:700;text-decoration:none;flex-shrink:0;white-space:nowrap}
.golink:hover{background:#ff4ad6}
.golink:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sync button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* 응답 수 + 참석 의사 */
.head{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;margin-top:24px}
.count{background:var(--plum);border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;min-height:176px}
.count h2,.panel h2{font-size:16px;font-weight:700;line-height:24px;color:var(--soft)}
.count strong{display:block;font:800 72px/1 var(--display);letter-spacing:-.04em}
.count strong small{font:700 20px/1 var(--body);letter-spacing:0;margin-left:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.rows{margin-top:16px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 96px;gap:16px;align-items:center;min-height:28px}
.row b{font-size:16px;font-weight:650;line-height:22px}
.track{height:10px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;display:flex}
.track i{display:block;height:100%;width:0;transition:width .6s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.bump{animation:bump .9s ease-out}
@keyframes bump{0%{background:rgba(255,18,200,.28)}100%{background:rgba(255,18,200,0)}}
.row,.drow{border-radius:8px}
.drow output strong{transition:background .3s,color .3s}
.track i.yes{background:var(--pink)}
.track i.maybe{background:var(--magenta)}
.track i.no{background:#7b6a7a}
.track i.one{background:var(--pink)}
.row output{text-align:right;font-size:16px;font-weight:700;line-height:22px;white-space:nowrap}
.row output small{font-size:14px;font-weight:500;color:var(--mute);margin-left:6px}

/* 날짜별 */
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.stack{display:grid;gap:16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:14px;line-height:20px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .yes{background:var(--pink)}
.legend .maybe{background:var(--magenta)}
.year{margin:20px 0 10px;font:500 13px/20px var(--display);letter-spacing:.02em;color:var(--soft)}
.drow{display:grid;grid-template-columns:84px minmax(0,1fr) 150px;gap:16px;align-items:center;min-height:36px;padding:2px 0}
.drow + .drow{border-top:1px solid rgba(255,255,255,.07)}
.drow b{font-size:16px;font-weight:650;white-space:nowrap}
.drow b small{font-size:12px;font-weight:700;color:var(--soft);margin-left:6px}
.drow output{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;text-align:right;font-size:14px;line-height:20px;white-space:nowrap}
.drow output .y{color:var(--pink);font-weight:600}
.drow output .m{color:#ff7ade;font-weight:600}
.drow output strong{font-size:16px;font-weight:800}
.drow output strong{justify-self:end;min-width:32px;padding:1px 8px;border-radius:999px;text-align:center}
.drow.best output strong{background:#fff;color:#000}
.legend .best{width:auto;height:auto;padding:0 7px;border-radius:999px;background:#fff;color:#000;font-style:normal;font-size:11px;font-weight:800;line-height:16px}
.cols{display:grid;grid-template-columns:84px minmax(0,1fr) 150px;gap:16px;font-size:14px;line-height:20px;color:var(--mute)}
.cols>span:last-child{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;text-align:right;align-items:center}
.cols>span:last-child>span:last-child{padding-right:8px}
.cols i{display:inline-block;width:10px;height:10px;border-radius:3px}
.cols i.yes{background:var(--pink)}
.cols i.maybe{background:var(--magenta)}

/* 남긴 말 */
.wide{margin-top:16px}
.says{list-style:none;padding:0;margin-top:6px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:32px}
.says li{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px;line-height:1.5}
#progs .row{grid-template-columns:88px minmax(0,1fr) 88px}
.says b{display:block;font-size:13px;font-weight:700;color:var(--soft);margin-bottom:2px}
.note{margin-top:8px;font-size:14px;line-height:1.5;color:var(--mute)}
.empty{margin-top:14px;font-size:14px;color:var(--mute)}
.foot{margin-top:24px;font-size:14px;line-height:20px;color:var(--mute)}

@media(max-width:860px){
  .wrap{padding-top:24px}
  .sync{width:100%;gap:8px}
  #stamp{flex:1;min-width:0}
  .golink{width:44px;padding:0;justify-content:center}
  .golink span{display:none}
  .head,.grid,.says{grid-template-columns:1fr}
  #progs .row{grid-template-columns:1fr auto}
  .count{min-height:0;flex-direction:row;align-items:flex-end}
  .count strong{font-size:56px}
  .panel,.count{padding:20px;border-radius:16px}
  .row{grid-template-columns:1fr auto;gap:6px 12px}
  .row .track{grid-column:1 / -1;grid-row:2}
  .drow,.cols{grid-template-columns:72px minmax(0,1fr) 132px;gap:10px}
  .drow output,.cols>span:last-child{grid-template-columns:1fr 1fr 32px;gap:6px}
}
@media(max-width:480px){
  .drow,.cols{grid-template-columns:68px minmax(0,1fr) 104px;gap:8px}
  .drow output,.cols>span:last-child{grid-template-columns:30px 30px 32px;gap:6px}
  .drow output strong{min-width:0;padding:1px 6px}
  .cols>span:last-child>span:last-child{padding-right:6px}
}
@media(prefers-reduced-motion:reduce){.track i{transition:none}.bump{animation:none}.drow output strong{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p>D.LIGHT 팀 대항전</p>
      <h1>수요조사 집계</h1>
    </div>
    <div class="sync" id="sync"><i></i><span id="stamp"><b id="when">불러오는 중입니다.</b><small>30초마다 자동으로 갱신합니다.</small></span><a class="golink" href="./" target="_blank" rel="noopener" aria-label="투표 페이지 열기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg><span>투표 페이지</span></a><button type="button" id="reload">새로고침</button></div>
  </header>

  <section class="head">
    <div class="count"><h2>응답</h2><strong><span id="total">0</span><small>명</small></strong></div>
    <div class="panel">
      <h2>참석 의사</h2>
      <div class="rows" id="attend"></div>
    </div>
  </section>

  <section class="grid">
    <div class="panel">
      <h2>날짜별 참석 가능 인원</h2>
      <div class="legend"><span><i class="yes"></i>갈게요</span><span><i class="maybe"></i>가고 싶은데 확답이 어려워요</span><span><i class="best">합계</i>가장 많은 날짜</span></div>
      <div id="dates"></div>
    </div>
    <div class="panel">
      <h2>기대되는 종목</h2>
      <p class="note" id="prognote"></p>
      <div class="rows" id="progs"></div>
    </div>
  </section>
  <section class="panel wide">
    <h2>남긴 말 <span id="saycount"></span></h2>
    <ul class="says" id="says"></ul>
  </section>
  <p class="foot">같은 수정코드로 다시 보낸 응답은 마지막 것만 셉니다.</p>
</div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzuLCoBmKUrx3KNtcnFPugeVsgSnueBo2pZ_cpPPnmTDKJ-3ziD53N8-R3Vuh6z8T1H/exec";
const API = /^(127\.0\.0\.1|localhost)$/.test(location.hostname) ? "api/survey" : ENDPOINT;
// 초대장 선택지에 적힌 글자 그대로
const ATTEND = [["yes", "갈게요"], ["maybe", "가고 싶은데 확답이 어려워요"], ["no", "이번엔 어려워요"]];
const PROGS = [["move", "가벼운 운동"], ["coop", "협동 미션"], ["brain", "두뇌 게임"]];
const DATES = [
  {v:"2026-12-12", y:"2026", d:"12/12", w:"토"}, {v:"2026-12-19", y:"2026", d:"12/19", w:"토"},
  {v:"2027-01-09", y:"2027", d:"1/9", w:"토"}, {v:"2027-01-10", y:"2027", d:"1/10", w:"일"},
  {v:"2027-01-16", y:"2027", d:"1/16", w:"토"}, {v:"2027-01-17", y:"2027", d:"1/17", w:"일"},
  {v:"2027-01-23", y:"2027", d:"1/23", w:"토"}, {v:"2027-01-24", y:"2027", d:"1/24", w:"일"},
];
const $ = (s) => document.querySelector(s);
const pct = (n, t) => t ? Math.round(n / t * 100) : 0;

$("#attend").innerHTML = ATTEND.map(([k, label]) => `<div class="row" data-k="${k}"><b>${label}</b><div class="track"><i class="${k}"></i></div><output><span class="n">0</span>명<small><span class="p">0</span>%</small></output></div>`).join("");
$("#progs").innerHTML = PROGS.map(([k, label]) => `<div class="row" data-k="${k}"><b>${label}</b><div class="track"><i class="one"></i></div><output><span class="n">0</span>명<small><span class="p">0</span>%</small></output></div>`).join("");
$("#dates").innerHTML = ["2026", "2027"].map((y) => `<p class="year">${y}</p><div class="cols"><span>날짜</span><span></span><span><span><i class="yes"></i></span><span><i class="maybe"></i></span><span>합계</span></span></div>` +
  DATES.filter((x) => x.y === y).map((x) => `<div class="drow" data-v="${x.v}"><b>${x.d}<small>${x.w}</small></b><div class="track"><i class="yes"></i><i class="maybe"></i></div><output><span class="y">0</span><span class="m">0</span><strong>0</strong></output></div>`).join("")).join("");

const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
const shown = new WeakMap();
let first = true;
// 숫자를 이전 값에서 새 값까지 올린다. 값이 바뀌었으면 true
function count(el, to) {
  const from = shown.has(el) ? shown.get(el) : 0; shown.set(el, to);
  if (still || from === to) { el.textContent = to; return from !== to; }
  const t0 = performance.now(), dur = 600;
  const step = (now) => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step); return true;
}
// 처음에는 줄마다 조금씩 늦게 자라고, 갱신 때는 바뀐 줄만 반짝인다
function touch(el, i, changed) {
  el.style.setProperty("--d", first ? i * 40 + "ms" : "0ms");
  if (!first && changed && !still) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}
function draw(t) {
  count($("#total"), t.total);
  ATTEND.forEach(([k], i) => {
    const el = $(`#attend [data-k=${k}]`), n = t.attend[k] || 0;
    const ch = count(el.querySelector(".n"), n); count(el.querySelector(".p"), pct(n, t.total)); touch(el, i, ch);
    el.querySelector("i").style.width = pct(n, t.total) + "%";
  });
  // 종목 비율은 참석 의사가 있는 사람(어려워요 제외) 기준
  const going = (t.attend.yes || 0) + (t.attend.maybe || 0);
  $("#prognote").textContent = `비율은 ‘이번엔 어려워요’를 제외한 ${going}명 기준입니다. 복수 선택 결과입니다.`;
  PROGS.forEach(([k], i) => {
    const el = $(`#progs [data-k=${k}]`), n = t.progs[k] || 0;
    const ch = count(el.querySelector(".n"), n); count(el.querySelector(".p"), pct(n, going)); touch(el, i + 3, ch);
    el.querySelector("i").style.width = pct(n, going) + "%";
  });
  const max = Math.max(1, ...DATES.map((x) => t.dates[x.v] || 0));
  const top = Math.max(...DATES.map((x) => t.dates[x.v] || 0));
  DATES.forEach((x, i) => {
    const el = $(`#dates [data-v="${x.v}"]`), sum = t.dates[x.v] || 0;
    const by = (t.dateBy && t.dateBy[x.v]) || {yes: sum, maybe: 0};
    const [iy, im] = el.querySelectorAll("i");
    count(el.querySelector(".y"), by.yes); count(el.querySelector(".m"), by.maybe);
    touch(el, i, count(el.querySelector("strong"), sum));
    iy.style.width = by.yes / max * 100 + "%"; im.style.width = by.maybe / max * 100 + "%";
    el.classList.toggle("best", top > 0 && sum === top);
  });
  first = false;
  const says = t.comments || [];
  $("#saycount").textContent = says.length ? says.length + "개" : "";
  const ul = $("#says"); ul.textContent = "";
  if (!says.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "아직 남긴 말이 없습니다."; ul.append(li); }
  for (const c of says) {
    const li = document.createElement("li"), b = document.createElement("b");
    b.textContent = c.nick; li.append(b, c.memo); ul.append(li);
  }
}

let busy = false;
async function load() {
  if (busy) return; busy = true;
  try {
    const t = await (await fetch(API, {cache: "no-store"})).json();
    if (!t.ok) throw new Error("bad");
    draw(t);
    $("#sync").classList.remove("bad");
    $("#when").textContent = new Date().toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", second: "2-digit"}) + " 기준";
  } catch (e) {
    $("#sync").classList.add("bad");
    $("#when").textContent = "불러오지 못했습니다. 잠시 뒤 다시 시도합니다.";
  } finally { busy = false; }
}
$("#reload").addEventListener("click", load);
load();
setInterval(() => { if (!document.hidden) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
